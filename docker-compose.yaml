services:

  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: game-expert
    ports:
      - "3308:3306"
    healthcheck:
          test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
          interval: 5s
          retries: 5

  redis:
    image: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      retries: 5
    ports:
      - "6380:6379"

  game-expert-1:
      build: .
      ports:
        - "8081:8080"
      depends_on:
        mysql:
          condition: service_healthy
        redis:
          condition: service_healthy

  game-expert-2:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

